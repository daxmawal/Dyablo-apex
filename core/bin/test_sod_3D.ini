[run]                
tend=0.25              
initial_conditions=sod                 
nstepmax=100000                

[dt]
hydro_cfl=0.8

[amr]
level_min=3
level_max=7

coarse_oct_resolution_y=2
coarse_oct_resolution_z=2

bx=4                   
by=4                   
bz=4                   

markers_kernel=RefineCondition_pseudo_gradient

epsilon_coarsen=0.005                
epsilon_refine=0.01                

cycle_frequency=1                
load_balancing_frequency=50                  

nboctspergroup=1024                  

[hydro]                
gamma0=1.666               
riemann=hllc
update=HydroUpdate_euler              

[mesh]
ndim=3

xmin=0.0                 
xmax=1.0                 

ymin=0.0                 
ymax=0.25 

zmin=0.0                 
zmax=0.25 

boundary_type_xmax=reflecting          
boundary_type_xmin=reflecting          

boundary_type_ymax=periodic            
boundary_type_ymin=periodic   

boundary_type_zmax=periodic            
boundary_type_zmin=periodic 

[sod]
pl=1                   
pr=0.1
rhol=1                   
rhor=0.125               
x0=0.5

[output]
outputdir=./                  
outputprefix=test_sod_3D
write_variables=rho,rho_vx,e_tot